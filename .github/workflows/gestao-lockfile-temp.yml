name: Atualizar lockfile da gestão
on:
  push:
    branches: [feat/gestao-auth-leads]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sincronizar lockfile sem executar scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit do lockfile, se houver alteração
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sincronizar lockfile do PostgreSQL"
            git push
          fi
