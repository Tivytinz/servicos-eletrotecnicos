name: TEMP - gerar lockfile seguro
on:
  push:
    branches: ["fix/whatsapp-business-99610-5841"]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Gerar lockfile sem alterar a branch
        run: |
          npm install --package-lock-only --save-exact next@16.4.5 eslint-config-next@16.4.5
          npm audit --omit=dev --audit-level=high
          node -e 'const fs=require("node:fs");for(const p of ["package.json","package-lock.json"]){console.log("BEGIN_LOCK_DATA:"+p);const s=fs.readFileSync(p).toString("base64");for(let i=0;i<s.length;i+=2000)console.log("LOCK_DATA:"+p+":"+s.slice(i,i+2000));console.log("END_LOCK_DATA:"+p)}'
