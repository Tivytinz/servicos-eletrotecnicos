name: Check

on:
  pull_request:
  push:
    branches: [main, feat/gestao-auth-leads]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, testes, banco e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências com lockfile
        run: npm ci
      - name: Auditar vulnerabilidades de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Aplicar migrations no PostgreSQL descartável
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/gestao_test
          GESTAO_MIGRATIONS_CONFIRM: APLICAR_GESTAO
        run: |
          node scripts/gestao-migrate.mjs --apply
          node scripts/gestao-migrate.mjs --apply
          node scripts/gestao-migrate.mjs --check
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d gestao_test -v ON_ERROR_STOP=1 -c "CREATE ROLE gestao_app LOGIN PASSWORD 'teste-somente-ci'"
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d gestao_test -v app_role=gestao_app < db/grants/gestao-app.sql
      - name: Testes, lint e compilação
        env:
          GESTAO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gestao_test
          GESTAO_TEST_APP_DATABASE_URL: postgres://gestao_app:teste-somente-ci@127.0.0.1:5432/gestao_test
        run: npm run check
      - name: Garantir que usuário app não pode escrever em financeiro
        run: |
          if docker exec -i "${{ job.services.postgres.id }}" psql -U gestao_app -d gestao_test -v ON_ERROR_STOP=1 -c "INSERT INTO gestao.lancamentos_financeiros (chave_idempotencia, categoria, valor_centavos) VALUES ('teste', 'receita', 1)"; then
            echo "FALHA: usuário de aplicação possui permissão indevida no financeiro"
            exit 1
          fi
